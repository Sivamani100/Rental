name: rental
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  supabase_flutter: ^2.17.2
  image: ^4.9.2
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  lottie: ^3.5.1
  share_plus: ^13.3.0
  webview_flutter: ^4.10.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFEB3A"
    theme_color: "#FFEB3A"
