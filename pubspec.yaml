name: rental
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.13+23

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.2.3
  supabase_flutter: ^2.17.2
  image: ^4.9.2
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  lottie: ^3.5.1
  share_plus: ^13.3.0
  webview_flutter: ^4.10.0
  http: ^1.2.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  device_info_plus: ^13.2.0
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9
  image_cropper: ^12.2.1
  flutter_dynamic_icon_plus: ^1.4.1
  device_frame: ^1.1.0
  uuid: ^4.6.0
  speech_to_text: ^7.5.0

  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  gal: ^2.3.3
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFEB3A"
    theme_color: "#FFEB3A"
